<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F1 数据中心</title>
<link rel="stylesheet" href="style.css?v=20261117h">
</head>
<body>
<header>
  <div class="logo">F1 数据中心</div>
  <nav>
    <button class="tab active" data-tab="races">赛事数据</button>
    <button class="tab" data-tab="posts">帖子分析</button>
    <button class="tab" data-tab="ups">UP 订阅</button>
  </nav>
  <div class="nav-auth">
    <span id="nav-auth-guest"><button id="btn-nav-login">登录 / 注册</button></span>
    <span id="nav-auth-user" style="display:none">
      <span id="nav-auth-name" class="nav-name"></span>
      <button id="btn-nav-account">账号</button>
      <button id="btn-nav-logout">退出</button>
    </span>
  </div>
</header>

<main>
  <section id="tab-races" class="tab-panel active">
    <div class="subnav">
      <button class="subtab active" data-sub="standings">积分榜</button>
      <button class="subtab" data-sub="results">每站结果</button>
      <button class="subtab" data-sub="compare">车手对比</button>
    </div>
    <div id="sub-standings" class="sub-panel active"></div>
    <div id="sub-results" class="sub-panel"></div>
    <div id="sub-compare" class="sub-panel"></div>
  </section>

  <section id="tab-posts" class="tab-panel">
    <div class="posts-toolbar">
      <button id="btn-scrape">手动抓取一次</button>
      <label class="filter-label">分站 <select id="posts-race-filter"><option value="">全部帖子</option></select></label>
      <label class="filter-label">时间 <select id="posts-time-filter"><option value="">全部时间</option></select></label>
      <label class="filter-label">立场 <select id="posts-stance-filter"><option value="">全部立场</option><option value="争议">争议</option><option value="质疑">质疑</option><option value="支持">支持</option><option value="调侃">调侃</option><option value="中立">中立</option></select></label>
      <span id="scrape-status"></span>
      <span id="scheduler-status"></span>
    </div>
    <div id="posts-list"></div>
  </section>

  <section id="tab-ups" class="tab-panel">
    <div class="posts-toolbar">
      <input id="ups-add-input" placeholder="粘贴 UP 主页链接或名称，如 临渊_Aslinger" style="flex:1;min-width:220px">
      <button id="btn-ups-add">添加订阅</button>
      <button id="btn-ups-check">立即检查一次</button>
      <span id="ups-status"></span>
      <span id="ups-scheduler-status"></span>
      <label class="filter-label">立场 <select id="ups-stance-filter"><option value="">全部立场</option><option value="争议">争议</option><option value="质疑">质疑</option><option value="支持">支持</option><option value="调侃">调侃</option><option value="中立">中立</option></select></label>
    </div>
    <div id="ups-subs"></div>
    <h3 class="ups-feed-title">内容汇总（每 2 小时自动更新）</h3>
    <div id="ups-list"></div>
  </section>
</main>

<div id="auth-modal" class="sub-modal">
  <div class="sub-modal-mask" onclick="closeAuthModal()"></div>
  <div class="sub-modal-box auth-box">
    <button class="sub-modal-close" onclick="closeAuthModal()">×</button>
    <div class="auth-tabs">
      <button id="auth-tab-login" class="auth-tab active">登录</button>
      <button id="auth-tab-register" class="auth-tab">注册</button>
    </div>
    <form id="auth-form" onsubmit="authSubmit(); return false;">
      <input id="auth-nick" placeholder="昵称" maxlength="20" autocomplete="username">
      <input id="auth-pass" type="password" placeholder="密码（≥6位）" autocomplete="current-password">
      <input id="auth-pass2" type="password" placeholder="确认密码（≥6位）" style="display:none" autocomplete="new-password">
      <div id="auth-error" class="auth-error"></div>
      <button id="btn-auth-submit" class="primary" style="width:100%">登录</button>
    </form>
    <div class="muted auth-hint">没有账号？切到「注册」标签，注册成功后自动登录。</div>
  </div>
</div>

<div id="account-modal" class="sub-modal">
  <div class="sub-modal-mask" onclick="closeAccountModal()"></div>
  <div class="sub-modal-box auth-box">
    <button class="sub-modal-close" onclick="closeAccountModal()">×</button>
    <div class="sub-modal-title">账号设置</div>
    <div class="sub-modal-meta" id="account-nick"></div>
    <div class="up-group-name">修改密码</div>
    <input id="acct-old" type="password" placeholder="当前密码" autocomplete="current-password">
    <input id="acct-new" type="password" placeholder="新密码（≥6位）" autocomplete="new-password">
    <button id="btn-acct-pw">修改密码</button>
    <div class="acct-sep"></div>
    <button id="btn-acct-delete" class="btn-sm danger">注销账号（删除账号与全部个人订阅）</button>
    <div id="acct-status" class="muted" style="margin-top:8px"></div>
  </div>
</div>

<datalist id="drivers-datalist"></datalist>
<script src="app.js?v=20261117e"></script>
</body>
</html>
