# Nginx 反向代理（备案已通过，域名 myrace.top）
# 保存为 /etc/nginx/sites-available/f1-site 后：
#   ln -s /etc/nginx/sites-available/f1-site /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
server {
    listen 80;
    server_name myrace.top www.myrace.top;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name myrace.top www.myrace.top;

    ssl_certificate     /etc/letsencrypt/live/myrace.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myrace.top/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
